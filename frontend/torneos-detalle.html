<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle Torneo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <!-- ================================= -->
  <!-- 🔥 VOLVER -->
  <!-- ================================= -->

  <button onclick="volver()">
    ← Volver
  </button>

  <!-- ================================= -->
  <!-- 🔥 TÍTULO -->
  <!-- ================================= -->

  <h1>Detalle del Torneo</h1>

  <!-- ================================= -->
  <!-- 🔥 INFO TORNEO -->
  <!-- ================================= -->

  <div id="detalle">
    Cargando...
  </div>

  <!-- ================================= -->
  <!-- 🔥 PARTICIPANTES -->
  <!-- ================================= -->

  <h2>Participantes</h2>

  <div id="participantes"></div>

  <!-- ================================= -->
  <!-- 🔥 BOTÓN MOSTRAR PANEL -->
  <!-- ================================= -->

  <button onclick="togglePanelUsuarios()">
    + Agregar Participante
  </button>

  <!-- ================================= -->
  <!-- 🔥 PANEL USUARIOS -->
  <!-- ================================= -->

  <div
    id="panelUsuarios"

    style="
      display:none;
      margin-top:20px;
      border:1px solid #ccc;
      padding:15px;
      max-width:500px;
    "
  >

    <h3>Agregar Participante</h3>

    <!-- 🔹 Buscador -->
    <input
      type="text"
      id="buscarUsuario"
      placeholder="Buscar usuario..."
      style="
        width:100%;
        padding:10px;
        margin-bottom:15px;
      "
    >

    <!-- 🔹 Lista -->
    <div id="listaUsuarios"></div>

  </div>

  <!-- ================================= -->
  <!-- 🔥 BRACKET -->
  <!-- ================================= -->

  <h2>Bracket</h2>

  <div id="bracket"></div>

  <!-- ================================= -->
  <!-- 🔥 TOP 3 -->
  <!-- ================================= -->

  <h2>Top 3</h2>

  <div id="top3"></div>

  <!-- ================================= -->
  <!-- 🔥 JS -->
  <!-- ================================= -->

  <script src="/js/torneos.js"></script>

</body>
</html>
