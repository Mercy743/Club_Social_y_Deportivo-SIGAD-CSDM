<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGAD — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.loginPage {
    overflow-y: auto;
    height: auto;
    min-height: 100vh;
}

.container {
    display: flex;
    min-height: 100vh;
    position: relative;
    z-index: 2;
}

.leftPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 48px 32px;
    background: linear-gradient(180deg, #0E6873 0%, #1A2C30 60%, #0a0a0a 100%);
    position: relative;
    overflow: hidden;
}

.leftPanel::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(84,207,224,0.15), transparent);
    top: -60px; left: -60px;
    border-radius: 50%;
}

.logo {
    width: 160px;
    animation: float 6s ease-in-out infinite;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.clubNombre {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: white;
    text-align: center;
    position: relative;
    z-index: 1;
}

.clubSub {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 2px;
    text-align: center;
    position: relative;
    z-index: 1;
}

.dividerLine {
    width: 40px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #54cfe0, transparent);
    border-radius: 2px;
    position: relative;
    z-index: 1;
}

.motivational {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    text-align: center;
    font-style: italic;
    line-height: 1.6;
    max-width: 220px;
    position: relative;
    z-index: 1;
    min-height: 42px;
}

.rightPanel {
    flex: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 40px;
    background: #0a0a0a;
}

.loginContainer {
    width: 100%;
    max-width: 360px;
}

.loginGreeting h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: white;
    margin: 0 0 4px;
    text-shadow: none;
}

.loginGreeting p {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin: 0 0 28px;
}

.inputGroup {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
}

.inputLabel {
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    font-weight: 600;
}

.loginContainer input {
    width: 100%;
    max-width: none;
    padding: 14px 16px;
    margin: 0;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.9);
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    transition: border-color 0.2s, background 0.2s;
}

.loginContainer input:focus {
    outline: none;
    border-color: #0E6873;
    background: rgba(14,104,115,0.08);
    box-shadow: 0 0 0 3px rgba(14,104,115,0.15);
}

.loginContainer button[type="submit"] {
    width: 100%;
    max-width: none;
    margin: 8px 0 0;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #0E6873, #54cfe0);
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(14,104,115,0.4);
}

.loginContainer button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(14,104,115,0.5);
}

#message {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 14px;
    color: #ff6b6b;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.2);
    display: none;
    text-align: center;
}

#message.visible { display: block; }

#message.success {
    color: #54cfe0;
    background: rgba(14,104,115,0.15);
    border-color: rgba(14,104,115,0.3);
}

@media (max-width: 640px) {
    .container { flex-direction: column; }

    .leftPanel {
        flex: none;
        padding: 36px 24px 28px;
        gap: 14px;
    }

    .logo { width: 110px; }
    .clubNombre { font-size: 13px; }
    .motivational { font-size: 12px; min-height: 36px; }

    .rightPanel {
        flex: none;
        padding: 32px 20px 48px;
    }

    .loginGreeting h2 { font-size: 20px; }
}
</style>
</head>
<body class="loginPage">

<div class="particles"></div>

<div class="container">

    <div class="leftPanel">
        <img src="images/logo.png" class="logo" alt="Logo SIGAD">
        <div class="clubNombre">CLUB SOCIAL Y DEPORTIVO</div>
        <div class="clubSub">MORELIA</div>
        <div class="dividerLine"></div>
        <p id="motivationalText" class="motivational"></p>
    </div>

    <div class="rightPanel">
        <div class="loginContainer">
            <div class="loginGreeting">
                <h2>Hola de nuevo</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">
                <div class="inputGroup">
                    <label class="inputLabel">Correo electrónico</label>
                    <input type="email" id="emailInput" placeholder="tu@correo.com" required>
                </div>
                <div class="inputGroup">
                    <label class="inputLabel">Contraseña</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required>
                </div>
                <button type="submit">Iniciar sesión</button>
            </form>

            <p id="message"></p>
        </div>
    </div>

</div>

<script src="Js/config.js"></script>
<script src="Js/script.js"></script>
</body>
</html>
