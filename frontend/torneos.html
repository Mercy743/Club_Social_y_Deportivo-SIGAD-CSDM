<div class="particles"></div>

<div class="dashboardWrapper">

    <!-- TOPBAR -->
    <div class="dashboardTopbar">
        <div class="topbarBrand">
            <span class="topbarGreeting">Competencias</span>
            <h1>SIGAD <span class="topbarRole">· Torneos</span></h1>
        </div>
        <div class="topbarActions">
            <button onclick="window.location.href='dashboard.html'" class="secondaryBtn">← Volver</button>
            <button id="logoutBtn" class="logoutBtn">Cerrar sesión</button>
        </div>
    </div>

    <!-- STATS RÁPIDAS -->
    <p class="section-label">Resumen</p>
    <div class="quickStats" style="margin-bottom: 28px;">
        <div class="statPill">
            <strong id="totalTorneos">—</strong>
            <span>Total torneos</span>
        </div>
        <div class="statPill">
            <strong id="torneosActivos">—</strong>
            <span>En curso</span>
        </div>
        <div class="statPill">
            <strong id="torneosProgramados">—</strong>
            <span>Programados</span>
        </div>
        <div class="statPill">
            <strong id="torneosFinalizados">—</strong>
            <span>Finalizados</span>
        </div>
    </div>

    <!-- HEADER CON BUSCADOR -->
    <p class="section-label">Gestión de torneos</p>
    <div class="header-torneos">
        <div class="buscador-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="busqueda" placeholder="Buscar torneo...">
        </div>
        <button id="btnCrear" class="btn-crear-torneo">
            <i class="fas fa-plus"></i> Crear Torneo
        </button>
    </div>

    <!-- GRID DE TORNEOS -->
    <div id="contenedorTorneos" class="grid-torneos"></div>

</div>
<script src="Js/config.js"></script>
<script src="Js/torneos.js"></script>
<script>
// Stats de torneos
async function cargarStatsTorneos() {
    try {
        const res = await fetch('http://localhost:3000/api/torneos');
        const torneos = await res.json();
        document.getElementById('totalTorneos').textContent = torneos.length;
        document.getElementById('torneosActivos').textContent = torneos.filter(t => t.estado === 'en curso').length;
        document.getElementById('torneosProgramados').textContent = torneos.filter(t => t.estado === 'programado').length;
        document.getElementById('torneosFinalizados').textContent = torneos.filter(t => t.estado === 'finalizado').length;
    } catch(e) { console.error(e); }
}
cargarStatsTorneos();

// Buscador en tiempo real
document.addEventListener('DOMContentLoaded', () => {
    const busqueda = document.getElementById('busqueda');
    if (busqueda) {
        busqueda.addEventListener('input', () => {
            const texto = busqueda.value.toLowerCase();
            document.querySelectorAll('.card-torneo').forEach(card => {
                const nombre = card.querySelector('h3')?.textContent.toLowerCase() || '';
                card.style.display = nombre.includes(texto) ? 'block' : 'none';
            });
        });
    }
});
</script>
