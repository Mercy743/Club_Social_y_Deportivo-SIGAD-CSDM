<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAD — Sistema de Gestión Deportiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="loginPage">

<div class="particles"></div>

<div class="container">
    <!-- Panel izquierdo -->
    <div class="leftPanel">
        <img src="images/logo.png" class="logo" alt="Logo SIGAD">
        <div class="clubNombre">CLUB SOCIAL Y DEPORTIVO</div>
        <div class="clubSub">MORELIA</div>
        <div class="dividerLine"></div>
        <p id="motivationalText" class="motivational"></p>
    </div>

    <!-- Panel derecho (login) -->
    <div class="rightPanel">
        <div class="loginContainer">
            <div class="loginGreeting">
                <h2>Hola de nuevo</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">
                <div class="inputGroup">
                    <label class="inputLabel">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.com" required>
                </div>
                <div class="inputGroup" style="position: relative;">
                    <label class="inputLabel">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required style="padding-right: 44px;">
                    <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña" style="position: absolute; right: 10px; bottom: 8px; background: none; border: none; cursor: pointer; padding: 4px; z-index: 1; display: flex; align-items: center; justify-content: center; opacity: 0.6; transition: opacity 0.2s;">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#54cfe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;">
                            <path d="M1 12 C5 5, 19 5, 23 12"/>
                            <path d="M1 12 C5 19, 19 19, 23 12"/>
                            <circle cx="12" cy="12" r="3.5"/>
                        </svg>
                    </button>
                </div>
                 <a href="recuperar.html" style="display: block; text-align: right; font-size: 12px; color: #54cfe0; margin-top: 8px; text-decoration: none;">
                     ¿Olvidaste tu contraseña?
                 </a>
                <button type="submit">Iniciar sesión</button>
            </form>

            <button type="button" class="secondaryBtn" onclick="window.location.href='main.html'">
                Volver al Inicio
            </button>

            <p id="message"></p>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
