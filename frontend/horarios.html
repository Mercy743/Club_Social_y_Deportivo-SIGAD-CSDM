<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios - SIGAD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboardPage">

    <!-- FONDO -->
    <svg class="bg-playbook" viewBox="0 0 700 560" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
                <stop offset="30%" stop-color="#0d1618" stop-opacity="0"/>
                <stop offset="100%" stop-color="#0d1618" stop-opacity="0.7"/>
            </radialGradient>
        </defs>
        <rect x="60" y="40" width="580" height="490" rx="6" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>
        <line x1="60" y1="285" x2="640" y2="285" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <circle cx="350" cy="285" r="55" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <rect width="700" height="560" fill="url(#vignette)"/>
    </svg>

    <div class="dashboardWrapper">

        <!-- TOPBAR -->
        <div class="dashboardTopbar">
            <div class="topbarBrand">
                <span class="topbarGreeting">Módulo de gestión</span>
                <h1>SIGAD <span class="topbarRole">· Horarios</span></h1>
            </div>
            <div class="topbarActions">
                <button onclick="window.location.href='dashboard.html'" class="secondaryBtn">Volver</button>
                <button id="logoutBtn" class="logoutBtn">Cerrar sesión</button>
            </div>
        </div>

        <!-- FORMULARIO -->
        <p class="section-label" id="formLabel">Nuevo horario</p>
        <div class="dashboardCard" style="margin-bottom:24px;">
            <div class="eventForm">
                <input type="hidden" id="horarioId">

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <select id="espacioSelect">
                        <option value="">Seleccionar espacio</option>
                    </select>
                    <select id="actividadSelect">
                        <option value="">Seleccionar actividad</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <select id="instructorSelect">
                        <option value="">Seleccionar instructor</option>
                    </select>
                    <select id="diaSelect">
                        <option value="">Día de la semana</option>
                        <option value="lunes">Lunes</option>
                        <option value="martes">Martes</option>
                        <option value="miércoles">Miércoles</option>
                        <option value="jueves">Jueves</option>
                        <option value="viernes">Viernes</option>
                        <option value="sabado">Sábado</option>
                        <option value="domingo">Domingo</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <div>
                        <label style="font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px;">Hora inicio</label>
                        <input type="time" id="horaInicio">
                    </div>
                    <div>
                        <label style="font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px;">Hora fin</label>
                        <input type="time" id="horaFin">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <div>
                        <label style="font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px;">Fecha inicio vigencia</label>
                        <input type="date" id="fechaInicio">
                    </div>
                    <div>
                        <label style="font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px;">Fecha fin vigencia</label>
                        <input type="date" id="fechaFin">
                    </div>
                </div>

                <div style="display:flex; gap:12px;">
                    <button id="guardarBtn">Guardar horario</button>
                    <button id="cancelarBtn" class="secondaryBtn" style="display:none;">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- LISTA -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <p class="section-label" style="margin-bottom:0; flex:1;">Horarios registrados</p>
            <div style="display:flex; gap:10px; align-items:center;">
                <select id="filtroDia" style="max-width:160px; margin:0; padding:10px 14px; font-size:12px;">
                    <option value="">Todos los días</option>
                    <option value="lunes">Lunes</option>
                    <option value="martes">Martes</option>
                    <option value="miercoles">Miércoles</option>
                    <option value="jueves">Jueves</option>
                    <option value="viernes">Viernes</option>
                    <option value="sabado">Sábado</option>
                    <option value="domingo">Domingo</option>
                </select>
            </div>
        </div>
        <div id="horarioList"></div>

    </div>
    <script src="js/comunes.js"></script>
    <script src="js/horarios.js"></script>
</body>
</html>
