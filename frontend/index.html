<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAD — Sistema de Gestión Deportiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="loginPage">

<div class="particles"></div>

<div class="container">
    <!-- Panel izquierdo -->
    <div class="leftPanel">
        <img src="images/logo.png" class="logo" alt="Logo SIGAD">
        <div class="clubNombre">CLUB SOCIAL Y DEPORTIVO</div>
        <div class="clubSub">MORELIA</div>
        <div class="dividerLine"></div>
        <p id="motivationalText" class="motivational"></p>
    </div>

    <!-- Panel derecho (login) -->
    <div class="rightPanel">
        <div class="loginContainer">
            <div class="loginGreeting">
                <h2>Hola de nuevo</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">
                <div class="inputGroup">
                    <label class="inputLabel">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.com" required>
                </div>
                <div class="inputGroup">
                    <label class="inputLabel">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Iniciar sesión</button>
            </form>

            <button type="button" class="secondaryBtn" onclick="window.location.href='main.html'">
                Volver al Inicio
            </button>

            <p id="message"></p>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
