<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - SIGAD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboardPage">

<svg class="bg-playbook" viewBox="0 0 700 560" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
            <stop offset="30%" stop-color="#0d1618" stop-opacity="0"/>
            <stop offset="100%" stop-color="#0d1618" stop-opacity="0.7"/>
        </radialGradient>
    </defs>
    <rect x="60" y="40" width="580" height="490" rx="6" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>
    <line x1="60" y1="285" x2="640" y2="285" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="350" cy="285" r="55" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <rect width="700" height="560" fill="url(#vignette)"/>
</svg>

<div class="dashboardWrapper">

    <!-- TOPBAR -->
    <div class="dashboardTopbar">
        <div class="topbarBrand">
            <span class="topbarGreeting">Módulo de gestión</span>
            <h1>SIGAD <span class="topbarRole">· Pagos</span></h1>
        </div>
        <div class="topbarActions">
            <button onclick="window.location.href='dashboard.html'" class="secondaryBtn">← Volver</button>
            <button id="logoutBtn" class="logoutBtn">Cerrar sesión</button>
        </div>
    </div>

    <!-- RESUMEN -->
    <p class="section-label">Resumen</p>
    <div class="quickStats" style="margin-bottom: 28px;">
        <div class="statPill">
            <strong id="totalPagos">0</strong>
            <span>Total pagos</span>
        </div>
        <div class="statPill">
            <strong id="totalMonto">$0</strong>
            <span>Monto total</span>
        </div>
        <div class="statPill">
            <strong id="pagosHoy">0</strong>
            <span>Pagos hoy</span>
        </div>
        <div class="statPill">
            <strong id="pagosPendientes">0</strong>
            <span>Pendientes</span>
        </div>
    </div>

    <!-- FORMULARIO -->
    <p class="section-label">Registrar pago</p>
    <div class="dashboardCard" style="margin-bottom: 24px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;">ID de usuario</label>
                <input type="number" id="usuarioId" placeholder="Ej. 123" style="margin: 0; max-width: none;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;">Monto (MXN)</label>
                <input type="number" id="monto" placeholder="Ej. 500.00" step="0.01" style="margin: 0; max-width: none;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;">Fecha</label>
                <input type="date" id="fechaPago" style="margin: 0; max-width: none;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;">Método de pago</label>
                <select id="metodoPago" style="margin: 0;">
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="transferencia">Transferencia</option>
                    <option value="cheque">Cheque</option>
                </select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px;">Estado</label>
                <select id="estadoPago" style="margin: 0;">
                    <option value="pagado">Pagado</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button id="guardarPagoBtn" style="margin: 0; max-width: none; width: 100%;">Registrar pago</button>
            </div>
        </div>
    </div>

    <!-- FILTROS -->
    <p class="section-label">Pagos registrados</p>
    <div class="dashboardCard" style="margin-bottom: 16px;">
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="filtroUsuario" placeholder="Filtrar por ID de usuario" style="margin: 0; max-width: 220px;">
            <select id="filtroEstado" style="margin: 0; max-width: 180px;">
                <option value="">Todos los estados</option>
                <option value="pagado">Pagado</option>
                <option value="pendiente">Pendiente</option>
                <option value="cancelado">Cancelado</option>
            </select>
            <button id="filtrarBtn" class="secondaryBtn" style="margin: 0; max-width: 120px; padding: 14px 20px;">Filtrar</button>
            <button id="resetFiltroBtn" class="secondaryBtn" style="margin: 0; max-width: 120px; padding: 14px 20px;">Ver todos</button>
        </div>
    </div>

    <!-- LISTA -->
    <div class="dashboardCard">
        <div id="pagosList">Cargando pagos...</div>
    </div>

</div>

<script src="Js/pagos.js"></script>
</body>
</html>
