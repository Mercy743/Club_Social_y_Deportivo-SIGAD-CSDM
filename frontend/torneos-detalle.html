<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Torneo - SIGAD</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboardPage">

<div class="particles"></div>

<div class="dashboardWrapper">
    <div class="dashboardTopbar">
        <div class="topbarBrand">
            <span class="topbarGreeting">Competencias</span>
            <h1>SIGAD <span class="topbarRole">· Detalle Torneo</span></h1>
        </div>
        <div class="topbarActions">
            <button onclick="window.location.href='torneos.html'" class="secondaryBtn">Volver</button>
            <button id="logoutBtn" class="logoutBtn">Cerrar sesión</button>
        </div>
    </div>

    <div id="detalle"></div>

    <p class="section-label">Participantes</p>
    <div id="participantes"></div>

    <!-- Paginación para participantes -->
    <div class="paginacion-container" id="paginacionParticipantes">
        <button id="btnAnteriorParticipantes" class="btn-paginacion" disabled><i class="fas fa-chevron-left"></i> Anterior</button>
        <span id="paginaParticipantesInfo" class="pagina-badge">Página 1</span>
        <button id="btnSiguienteParticipantes" class="btn-paginacion">Siguiente <i class="fas fa-chevron-right"></i></button>
    </div>

    <div style="text-align: center; margin: 20px 0;">
        <button id="btnTogglePanel" onclick="togglePanelUsuarios()" class="btn-crear-torneo">
            <i class="fas fa-user-plus"></i> Agregar Participante
        </button>
    </div>

    <div id="panelUsuarios" style="display:none; margin-top:20px; background: rgba(20,20,20,0.68); border-radius: 16px; padding: 20px;">
        <input type="text" id="buscarUsuario" placeholder="Buscar usuario..." style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; margin-bottom: 15px;">
        <div id="listaUsuarios"></div>
        <!-- Paginación para usuarios -->
        <div class="paginacion-container" id="paginacionUsuarios" style="margin-top: 15px;">
            <button id="btnAnteriorUsuarios" class="btn-paginacion" disabled><i class="fas fa-chevron-left"></i> Anterior</button>
            <span id="paginaUsuariosInfo" class="pagina-badge">Página 1</span>
            <button id="btnSiguienteUsuarios" class="btn-paginacion">Siguiente <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <p class="section-label">Bracket</p>
    <div id="bracket"></div>

    <p class="section-label">Podio</p>
    <div id="top3"></div>
    <!-- RESEÑAS -->
    <p class="section-label">Reseñas</p>
    <div id="seccionReseñas" class="dashboardCard" style="margin-bottom: 24px;">
        <div id="resumenReseñas" style="margin-bottom: 20px;"></div>
        <div id="formularioReseña"></div>
    </div>
</div>
<script src="js/torneos.js"></script>
</body>
</html>
