<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Torneo - SIGAD</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboardPage">

<div class="particles"></div>

<div class="dashboardWrapper">
    <div class="dashboardTopbar">
        <div class="topbarBrand">
            <span class="topbarGreeting">Competencias</span>
            <h1>SIGAD <span class="topbarRole">· Crear Torneo</span></h1>
        </div>

        <div class="topbarActions">
            <button onclick="window.location.href='torneos.html'" class="secondaryBtn">
                ← Volver
            </button>

            <button id="logoutBtn" class="logoutBtn">
                Cerrar sesión
            </button>
        </div>
    </div>

    <div class="dashboardCard" style="max-width: 600px; margin: 0 auto;">

        <h2 id="tituloForm" style="margin-bottom: 24px;">
            Crear Torneo
        </h2>

        <form id="formTorneo" style="display: flex; flex-direction: column; gap: 20px;">

            <!-- NOMBRE -->
            <div>
                <label style="display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.6);">
                    Nombre del torneo *
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej: Copa de Verano 2024"
                    style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white;"
                    required
                >
            </div>

            <!-- DESCRIPCIÓN -->
            <div>
                <label style="display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.6);">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    rows="4"
                    placeholder="Describe el torneo..."
                    style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white;"
                ></textarea>
            </div>

            <!-- FECHAS -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">

                <div>
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.6);">
                        Fecha inicio *
                    </label>

                    <input
                        type="date"
                        id="fecha_inicio"
                        style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white;"
                        required
                    >
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.6);">
                        Fecha fin *
                    </label>

                    <input
                        type="date"
                        id="fecha_fin"
                        style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white;"
                        required
                    >
                </div>

            </div>

            <!-- ACTIVIDAD -->
            <div>
                <label style="display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.6);">
                    Actividad deportiva *
                </label>

                <select
                    id="actividad_id"
                    style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white;"
                    required
                >
                    <option value="">
                        Cargando actividades...
                    </option>
                </select>
            </div>

            <!-- TIPO TORNEO -->
            <div>
                <label style="display: block; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.6);">
                    Tipo de torneo *
                </label>

                <select
                    id="tipo_torneo"
                    style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white;"
                    required
                >
                    <option value="eliminacion">
                        Eliminación directa
                    </option>

                    <option value="liga">
                        Liga
                    </option>

                    <option value="grupos">
                        Fase de grupos
                    </option>
                </select>
            </div>

            <!-- BOTONES -->
            <div style="display: flex; gap: 12px; margin-top: 10px;">

                <button
                    type="submit"
                    style="flex: 1; background: linear-gradient(135deg, #0E6873, #54cfe0); border: none; padding: 12px; border-radius: 12px; color: white; font-weight: 600; cursor: pointer;"
                >
                    Guardar Torneo
                </button>

                <button
                    type="button"
                    onclick="window.location.href='torneos.html'"
                    style="flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: white; cursor: pointer;"
                >
                    Cancelar
                </button>

            </div>

        </form>
    </div>
</div>

<script src="js/comunes.js"></script>
<script src="js/torneos.js"></script>

</body>
</html>
